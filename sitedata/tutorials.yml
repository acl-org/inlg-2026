tutorials:
  - id: longform-challenge
    title: "Long-Form Analogy Evaluation Challenge"
    bodytext: |
      A shared task focused on automatically evaluating generated analogies for explaining Computer Science concepts. The shared task will be co-located with INLG 2026 (https://2026.inlgmeeting.org/), and participants will have the opportunity to write a paper describing their system and approach.

      [Competition (deadline: 01.08)](https://huggingface.co/spaces/analogy-evaluation/Analogy-Evaluation-Challenge)
      
      [Dataset](https://huggingface.co/datasets/analogy-evaluation/challenge-dataset)
      
      [Baseline code](https://github.com/yurinoviello/analogy-eval-baseline-INLG)
      
      **Organizers:** Bhavya (IBM), Yuri Noviello (Delft University of Technology)
  - id: alt-architectures
    title: "Alternative Architectures and Generative Paradigms for NLG"
    bodytext: |
      This workshop creates a dedicated forum — the Alternative Architectures Project (AAP) — to expand and diversify core NLG architecture research. Our goal is to encourage the community to focus on non-traditional machine learning structures that learn, process, and generate language differently.

      [Workshop website](https://aap-inlg.github.io/)
      
      [Call for papers](https://aap-inlg.github.io/cfp/)
      
      [Submission form (due 09.08)](https://openreview.net/group?id=aclweb.org/INLG/2026/Workshop/AAP)

      **Organizers:** Ruurd Kuiper (UMC Utrecht), Robert Bagheri (Utrecht University)
  - id: ynlg2026
    title: "YNLG 2026 - The 2nd Workshop for Young Researchers in Natural Language Generation"
    bodytext: |
      YNLG aims to foster a welcoming community of early-career researchers in NLG by providing a platform for PhD students and Master's students to present work-in-progress research, receive feedback from senior researchers and peers, and engage in discussions about current trends and future directions in Natural Language Generation.

      [Workshop website](https://ynlg-workshop.github.io/)
      
      [Call for papers](https://ynlg-workshop.github.io/#cfp)
      
      [Submission form (due 10.08)](https://openreview.net/group?id=aclweb.org/INLG/2026/Workshop/YNLG)

      **Organizers:** Nils Feldhus (University of Groningen), Rudali Huidrom (IIIT Delhi), Kristyna Onderkova (Charles University), Miriam Anschütz (Technical University of Munich), Barkavi Sundararajan (University of Aberdeen), Patricia Schmidtova (Charles University), Yongxin Zhou (Université Grenoble Alpes)
  - id: industrial-nlp
    title: "Workshop for Industrial NLP: NLP Research Towards Safety, Reliability, and Real-World Impact"
    bodytext: |
      A half-day workshop at INLG 2026 dedicated to natural language generation (NLG) and large language model (LLM) research shaped by real deployment settings.

      [Workshop website](https://industrialnlp.github.io/)
      
      [Call for papers](https://industrialnlp.github.io/cfp)
      
      [Submission form (due 01.08)](https://openreview.net/group?id=aclweb.org/INLG/2026/Workshop/Industrial_NLP)

      **Organizers:** Yizhi Li (University of Manchester), Yi Zhou (Cardiff University), Jingcheng Niu (TU Darmstadt), Haau-sing Li (TU Darmstadt and Instituto de Telecomunicações), Joanne Boisson (Cardiff University), Yi Qi (University of Leeds)
  - id: aiwolfdial2026
    title: "The 4th Workshop of AI Werewolf and Dialog System 2026 (AIWolfDial2026)"
    bodytext: |
      This workshop focuses on the integration of dialogue systems, natural language processing (NLP), large language models (LLMs), and game AI, with a particular emphasis on applications using the Werewolf game as a testbed.

      [Workshop website](https://aiwolfdial.github.io/aiwolf-nlp/en/page/inlg_2026/)

      [Call for participation](https://aiwolfdial.github.io/aiwolf-nlp/en/menu/inlg_2026_en/paper_submission/)

      **Organizers:** Yoshinobu Kano (Shizuoka University, Japan), Claus Aranha (Tsukuba University, Japan), Takashi Otsuki (Yamagata University, Japan), Fujio Toriumi (The University of Tokyo, Japan), Hirotaka Osawa (Keio University, Japan), Daisuke Katagami (Tokyo Polytechnic University, Japan), Michimasa Inaba (The University of Electro-Communications, Japan), Kei Harada (The University of Electro-Communications, Japan), Takeshi Ito (The University of Electro-Communications, Japan)
  - id: beyond-leaderboards
    title: "Beyond Leaderboards: Evaluation Practices for Open-Ended and Perspectival NLG"
    bodytext: |
      We are pleased to congratulate the organizers of this selected workshop for INLG 2026.

      **Organizers:** Christina Niklaus (University of St.Gallen), Thomas Huber (University of St.Gallen)
