  - name: Marie-Catherine de Marneffe
    aff: FNRS - UCLouvain
    url: https://cental.uclouvain.be/team/mcdm/index.html
    im: static/images/speakers/marie_catherine.jpg
    keynote_title: Understanding Label Variation Through Explanations
    keynote_description: NLP researchers have increasingly acknowledged that humans often diverge in their interpretations of various NLP tasks, and that such variation should be captured if robust language understanding is to be achieved. In this talk, I will focus on analyzing label variation in the Natural Language Inference (NLI) task, in which, assuming the truth of a premise, one judges whether a hypothesis text is true, false, or undetermined. For instance, if one says: “My friend often travels with a heavy suitcase”, can it be inferred that “My friend often travels with a light suitcase”? I will examine the sources of NLI label variation through explanations provided by humans and LLMs, arguing that, in the presence of variation, labels without explanations are not meaningful and that we need better measures to capture similarities of explanations.

