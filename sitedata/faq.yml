faq:
  - section: Frequently Asked Questions
    qa:
      - question: Can you issue an invitation letter for visa application?
        answer: |
          ### Invitation (visa) letters
          
          Participants are responsible for checking whether they need a short-stay Schengen visa to visit the Netherlands and for completing their own visa application.  
          
          Please note: In-person participation in INLG 2026 in the Netherlands is only possible with valid entry/visa and in compliance with all Dutch/EU laws and regulations (including any applicable sanctions rules). If attendance is not possible due to these requirements, registration may be cancelled and our refund policy applies.  
          
          #### Do you need a visa?  
          
          * Whether you need a visa depends on your nationality and country of residence.  
          * Consult the official information from the Government of the Netherlands and the Dutch embassy/consulate in your country.  
          
          The INLG 2026 organisers will provide an official confirmation as soon as you register. You can use this to provide evidence with the relevant authorities when applying for a visa. This confirmation:
          
          * Confirms your registration to attend INLG 2026,  
          * States the conference dates and venue (Utrecht, the Netherlands).
          
          #### Important notes:  
          
          * Confirmation is issued only to registered participants whose registration fee has been fully paid.  
          * The confirmation supports your visa application but does not guarantee visa approval. The decision rests entirely with Dutch authorities.  
          * We cannot issue letters for unregistered or unpaid participants.
          
          Questions?
          Contact INLG 2026 local organisers via the Contact page, including your full name and registration ID.  
      - question: What papers may be committed to INLG 2026?
        answer: You may commit any paper submitted to ARR since ARR started.
      - question: What version of my paper should I commit to INLG 2026?
        answer: You must commit the most recent version of the paper that has received reviews.
      - question: Does INLG 2026 have an anonymity policy?
        answer: INLG 2026 follows the [ACL policy](https://www.aclweb.org/adminwiki/index.php/ACL_Policies_for_Review_and_Citation).
      - question: Can I respond to the reviews when I commit to INLG 2026?
        answer: When committing an ARR paper to INLG 2026 via the paper submission system, there will be space for you to provide an author response to review to the INLG 2026 area chairs. The author's response is mainly to raise potential concerns about objective misunderstandings by the reviewers and/or by the Action Editor about the technical aspect of the paper. These comments will only be visible to the INLG 2026 area chairs and program chairs. They will NOT be shared with the ARR reviewers or action editor.
      - question: Can I revise the paper that I am committing to INLG 2026?
        answer: The acceptance decisions will be made on the basis of the most recent version of your paper that was submitted to ARR and received reviews. If your paper is accepted to INLG 2026, you can revise it before sending the camera-ready version.
